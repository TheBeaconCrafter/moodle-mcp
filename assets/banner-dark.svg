<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="moodle-mcp: your Moodle account as tools Claude can use">
  <rect width="1200" height="400" rx="20" fill="#14110F"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" fill="none" stroke="#2A241F"/>

  <!-- left: wordmark -->
  <g transform="translate(72 96)">
    <rect width="56" height="56" rx="13" fill="#F98012"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.21875)">
      <path d="M58 186 V118 a30 30 0 0 1 60 0 V186" stroke-width="22"/>
      <path d="M118 118 a30 30 0 0 1 60 0 V150" stroke-width="22"/>
