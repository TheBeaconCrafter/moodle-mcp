    <text x="2" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#B9AE9F">Your Moodle account, as tools Claude can use.</text>
    <text x="2" y="226" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#8A7F72" letter-spacing="0.4">deadlines · course files · grades · announcements</text>
  </g>

